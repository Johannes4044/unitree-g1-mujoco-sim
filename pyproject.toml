[project]
name = "g1"
version = "0.1.0"
description = "Unitree G1 MuJoCo simulator: scene, scenarios, robot sources and whole-body controllers"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# Permissive only (Apache-2.0 / MIT / BSD). Pinned as the main repository's `sim` extra pins:
#   mujoco      Apache-2.0, exact pin - the model files are compiled against this version
#   numpy       BSD-3-Clause
#   pillow      MIT-CMU; bundles libwebp (BSD-3-Clause), which writes the rollout WebPs
#   imageio     BSD-2-Clause; writes the PNGs through Pillow
#   onnxruntime MIT; CPU inference of the Holosoma walking policy (src/g1/wbc/holosoma.py)
# Deliberately absent: lerobot, torch, av, imageio-ffmpeg (its wheel is a GPL ffmpeg build),
# fastapi, pyzmq - nothing here is a web service and there is no ffmpeg anywhere.
dependencies = [
  "mujoco==3.12.0",
  "numpy>=1.26,<3",
  "pillow>=10",
  "imageio",
  "onnxruntime>=1.18",
]

# Dev tooling. Mirrored in two places on purpose: `[dependency-groups]` is what `uv sync`
# installs by default (PEP 735), `[project.optional-dependencies]` is what
# `pip install -e ".[dev]"` understands. Neither adds a runtime dependency - the five-package
# runtime set above is untouched, and the tests use only pytest plus what already ships.
[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/g1"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
# The fast set is the default. Rendering and the multi-thousand-step rollouts live behind the
# `slow` marker; the contracts - the RobotSource conformance suite, the 31-slot layout, the
# safety refusals, seeding - are all in the fast set and run in a couple of seconds.
#
#   pytest                  the fast set (what you run while editing, and what CI gates on)
#   pytest -m slow          only the slow set
#   pytest -m ""            everything
addopts = "-m 'not slow' --strict-markers"
markers = [
  "slow: rendering sweeps, every-scenario sweeps and long rollouts (excluded by default)",
]
